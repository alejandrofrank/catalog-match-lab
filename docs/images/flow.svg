<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Catalog matching flow"><rect width="1280" height="330" rx="16" fill="#0b1220"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="52" fill="#83aeff" font-size="15" letter-spacing="2">MATCHING FLOW</text><rect x="40" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="62" y="131" fill="#83aeff" font-size="20" font-weight="600">Import CSV</text><text x="62" y="163" fill="#a7b8cf" font-size="14">Messy merchant names</text><path d="M322 144h19m-5-5 5 5-5 5" stroke="#83aeff" fill="none" stroke-width="2"/><rect x="347" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="369" y="131" fill="#83aeff" font-size="20" font-weight="600">Describe identity</text><text x="369" y="163" fill="#a7b8cf" font-size="14">Kind / brand / size / pack</text><path d="M629 144h19m-5-5 5 5-5 5" stroke="#83aeff" fill="none" stroke-width="2"/><rect x="654" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="676" y="131" fill="#83aeff" font-size="20" font-weight="600">Judge pairs</text><text x="676" y="163" fill="#a7b8cf" font-size="14">Rules or optional Jev</text><path d="M936 144h19m-5-5 5 5-5 5" stroke="#83aeff" fill="none" stroke-width="2"/><rect x="961" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#aeed8b" stroke-opacity=".6"/><text x="983" y="131" fill="#aeed8b" font-size="20" font-weight="600">Compare</text><text x="983" y="163" fill="#a7b8cf" font-size="14">Only accepted identities</text><text x="40" y="253" fill="#cbd9ec" font-size="16">Different size, variant or pack → reject. Missing evidence → review. Price never determines identity.</text><text x="40" y="288" fill="#849cbd" font-size="14">Offline fixtures run in your browser. Optional Jev calls go through the local server with a server-side key.</text></g></svg>
